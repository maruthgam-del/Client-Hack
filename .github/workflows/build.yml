name: Koharu Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koharu-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Koharu mod
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Find project (auto-unzip if repo only has the .zip)
        shell: bash
        run: |
          set -uo pipefail
          find_wrapper() {
            find . -maxdepth 4 -type f -name gradlew -not -path './.git/*' 2>/dev/null \
              | awk '{ print gsub("/","/"), $0 }' | sort -n | head -n 1 | cut -d' ' -f2-
          }
          wrapper="$(find_wrapper)"
          if [[ -z "$wrapper" ]]; then
            echo "gradlew not found, looking for a .zip in the repo..."
            mkdir -p .ci-src
            while IFS= read -r z; do
              echo "Unzipping: $z"
              unzip -q -o "$z" -d .ci-src || true
            done < <(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -not -path './.ci-src/*')
            wrapper="$(find_wrapper)"
          fi
          if [[ -z "$wrapper" ]]; then
            echo "::error::No gradlew found. Upload the Koharu project (gradlew, build.gradle, src/...) or the .zip to the repo root."
            exit 1
          fi
          dir="$(dirname "$wrapper")"
          chmod +x "$wrapper"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"
          echo "Project directory: $dir"
          for f in build.gradle settings.gradle gradle.properties src; do
            if [[ ! -e "$dir/$f" ]]; then
              echo "::error::Missing '$f' in $dir - the upload is incomplete."
              exit 1
            fi
          done

      - name: Build (compile + remap + package)
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"
          log="$GITHUB_WORKSPACE/build.log"
          : > "$log"

          # Show ALL compile errors at once (javac stops at 100 by default)
          cat > "$RUNNER_TEMP/all-errors.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.compilerArgs.addAll(['-Xmaxerrs', '10000', '-Xmaxwarns', '10000'])
              }
          }
          EOF

          if [[ -f gradle/wrapper/gradle-wrapper.jar ]]; then
            GRADLE="./gradlew"
          else
            echo "::warning::gradle-wrapper.jar is missing - downloading Gradle 9.2.1 directly"
            curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
            GRADLE="$RUNNER_TEMP/gradle-9.2.1/bin/gradle"
          fi

          ARGS=(build -x test --no-daemon --stacktrace --continue --console=plain --init-script "$RUNNER_TEMP/all-errors.gradle")

          "$GRADLE" "${ARGS[@]}" 2>&1 | tee -a "$log"
          status=${PIPESTATUS[0]}

          # One automatic retry only when the failure looks like a network problem
          if [[ $status -ne 0 ]] && grep -qiE 'Could not (resolve|GET|HEAD)|timed out|Connection (reset|refused)|Premature end of|Received status code 5|502 Bad Gateway|503 Service' "$log"; then
            echo "::warning::Network problem detected - retrying once"
            "$GRADLE" "${ARGS[@]}" --refresh-dependencies 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          exit $status

      - name: Collect mod JAR
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p "$GITHUB_WORKSPACE/.ci-artifacts"
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | sort)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo "::error::Build finished but no JAR was found in build/libs"
            exit 1
          fi
          cp "${jars[@]}" "$GITHUB_WORKSPACE/.ci-artifacts/"
          (cd "$GITHUB_WORKSPACE/.ci-artifacts" && sha256sum *.jar > SHA256SUMS.txt)
          ls -lh "$GITHUB_WORKSPACE/.ci-artifacts"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Koharu-Mod-JAR
          path: .ci-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: List every error (summary + annotations)
        if: always()
        shell: bash
        run: |
          log="$GITHUB_WORKSPACE/build.log"
          [[ -f "$log" ]] || exit 0
          {
            echo "## Build result / errors"
            echo '```'
            grep -nE 'error:|FAILED|What went wrong|Execution failed|Could not |BUILD (FAILED|SUCCESSFUL)' "$log" | head -n 400 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^/.*\.java:[0-9]+: error: ' "$log" | head -n 50 | while IFS= read -r line; do
            file="$(echo "$line" | sed -E 's|^([^:]+):([0-9]+): error: (.*)$|\1|')"
            num="$(echo "$line" | sed -E 's|^([^:]+):([0-9]+): error: (.*)$|\2|')"
            msg="$(echo "$line" | sed -E 's|^([^:]+):([0-9]+): error: (.*)$|\3|')"
            echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=$num::$msg"
          done || true

      - name: Upload build log and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Koharu-Build-Log
          path: |
            build.log
            ${{ env.PROJECT_DIR }}/build/reports/
            ${{ env.PROJECT_DIR }}/anubis/build/reports/
          if-no-files-found: ignore
          retention-days: 7
